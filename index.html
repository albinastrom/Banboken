<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://api.open-meteo.com https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee https://maps.mail.ru https://nominatim.openstreetmap.org https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Golfapp med GPS-avstånd, scorekort, WHS-handicap, matcher, statistik och Strokes Gained.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banboken">
<title>Banboken</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F3D2E'/%3E%3Cpath d='M26 14v34' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M28 14l16 7-16 7z' fill='%23C9A44C'/%3E%3Cellipse cx='32' cy='50' rx='14' ry='3' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#EEF3F0; --ink:#000000; --muted:#3E4F47; --line:#C9D5CE;
  --green:#0F3D2E; --green-2:#1B5E45; --on-green:#FFFFFF; --gold:#B8913A; --gold-ink:#000000;
  --under:#B23A2F; --over:#1D4E89; --danger:#A3271F; --ok:#1B6B3A;
  --font:'Barlow',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0E2219; --ink:#FFFFFF; --muted:#B4C4BB; --line:#284437;
    --green:#0F3D2E; --green-2:#2A7A5B; --on-green:#FFFFFF; --gold:#D6B25E; --gold-ink:#000000;
    --under:#FF8A7A; --over:#8EB8F0; --danger:#FF8A7A; --ok:#7FD69E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E2219; --ink:#FFFFFF; --muted:#B4C4BB; --line:#284437;
  --green:#0F3D2E; --green-2:#2A7A5B; --on-green:#FFFFFF; --gold:#D6B25E; --gold-ink:#000000;
  --under:#FF8A7A; --over:#8EB8F0; --danger:#FF8A7A; --ok:#7FD69E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);margin:0}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* Toppbalk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--on-green);border-bottom:2px solid var(--gold)}
.bar-in{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px}
.bar h1{font-size:24px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.mark{width:10px;height:22px;background:var(--gold);clip-path:polygon(0 0,100% 30%,0 60%)}
.bar-back{background:none;border:0;color:var(--on-green);font-size:34px;line-height:1;padding:4px 8px 8px 0;min-width:44px;min-height:44px}
.bar-btn{background:transparent;color:var(--on-green);border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}

.page{padding:16px}
.hero{padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hero h2{font-size:30px;line-height:1.1;margin-bottom:8px}
.hero p{margin:0 0 16px;max-width:36em}
.hello{font-family:var(--cond);font-size:22px;margin:0!important;color:var(--muted)}
.hcp{display:flex;align-items:baseline;gap:10px;color:var(--muted)}
.hcp span{font-family:var(--cond);font-size:64px;line-height:1;font-weight:700;color:var(--ink)}
.block{padding:16px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block h3,.form h3{font-size:20px;font-weight:600;margin:0 0 10px}
.form h3{margin-top:20px}
.muted{color:var(--muted);margin:0 0 12px}
.note{color:var(--muted);font-size:14px;margin:8px 0}
.meta{color:var(--muted);font-size:15px;margin:0 0 12px}
.warn{background:var(--gold);color:var(--gold-ink);padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;margin:0 0 12px}
.warn.tight{border-radius:0;margin:0;padding:6px 16px;font-size:13px}

/* Knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;border:0;font-weight:600;font-size:17px;text-decoration:none}
.btn.big{width:100%;min-height:60px;font-size:19px;font-family:var(--cond);letter-spacing:.02em}
.btn.gold{background:var(--green);color:var(--on-green);box-shadow:inset 0 -3px 0 var(--gold)}
.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.link{background:none;border:0;padding:12px 0;color:var(--green-2);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.link.danger{color:var(--danger);display:block;margin-top:12px}
.link.on{color:var(--danger)}

/* Rader */
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:64px}
.row:last-child{border-bottom:0}
.row-main{flex:1;display:flex;flex-direction:column}
.row-main small,.choice small{color:var(--muted);font-size:14px;font-weight:500}
.row-num{text-align:right;display:flex;flex-direction:column}
.row-num b{font-family:var(--cond);font-size:30px;line-height:1}
.row-num small{color:var(--muted)}
.chev{font-size:28px;color:var(--muted)}
.tag{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid var(--muted);color:var(--muted);align-self:flex-start;margin-top:2px}
.tag.demo{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tag.ok{border-color:var(--ok);color:var(--ok)}

/* Val */
.choices{display:grid;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-height:60px}
.choice.on{border-color:var(--green-2);background:var(--surface);box-shadow:inset 4px 0 0 var(--gold)}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;min-height:48px;background:var(--bg);border:0;border-right:2px solid var(--ink);font-weight:600;padding:0 6px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.hcpcalc{text-align:center}
.big-pair{display:flex;justify-content:center;gap:40px}
.big-pair div{display:flex;flex-direction:column}
.big-pair span{font-family:var(--cond);font-size:72px;font-weight:700;line-height:1}
.big-pair div+div span{color:var(--muted);font-size:44px;margin-top:28px}
.big-pair small{color:var(--muted);font-size:14px}
.formula{font-family:var(--cond);font-size:18px;color:var(--muted);margin:12px 0 4px}

/* Rond */
.scorebar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:var(--bg);text-align:center;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4}
.scorebar div{padding:6px 2px;display:flex;flex-direction:column;border-right:1px solid rgba(127,127,127,.35)}
.scorebar div:last-child{border-right:0}
.scorebar b{font-family:var(--cond);font-size:26px;line-height:1.1}
.scorebar small{font-size:12px;opacity:.85}
.play{padding-top:12px}
.hole-head{display:flex;align-items:stretch;gap:16px;margin-bottom:8px}
.hole-no{background:var(--green);color:var(--on-green);border-radius:14px;min-width:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;border-bottom:4px solid var(--gold)}
.hole-no small{font-size:13px;opacity:.85}
.hole-no span{font-family:var(--cond);font-size:76px;font-weight:700;line-height:.9}
.hole-head dl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:0;align-content:center}
.hole-head dt{font-size:13px;color:var(--muted)}
.hole-head dd{margin:0;font-family:var(--cond);font-size:28px;font-weight:600;line-height:1}
.entry{padding:10px 0}
.entry h3{font-size:18px;margin-bottom:8px}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick.strokes{grid-template-columns:repeat(4,1fr)}
.pick.three{grid-template-columns:repeat(3,1fr)}
.pick.four{grid-template-columns:repeat(4,1fr)}
.pick button{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-family:var(--cond);font-size:28px;font-weight:600}
.pick.three button,.pick.four button{font-family:var(--font);font-size:17px}
.pick button.under{color:var(--under)}
.pick button.on{background:var(--green);color:var(--on-green);border-color:var(--gold)}
.pick button.more{color:var(--muted)}
.gir{margin:6px 0;font-size:16px}
.gir small{color:var(--muted)}
.extra{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0;padding:0}
.extra summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
.extra summary::after{content:"+";margin-left:auto;font-size:24px}
.extra[open] summary::after{content:"−"}
.extra h3{font-size:16px;margin:8px 0}
.extra .pick{margin-bottom:12px}
.counter{display:flex;align-items:center;gap:12px;padding:6px 0}
.counter span{flex:1}
.counter button{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);font-size:26px;line-height:1}
.counter b{font-family:var(--cond);font-size:28px;min-width:28px;text-align:center}
.holenav{display:flex;gap:10px;margin:16px 0 10px}
.holenav .btn{flex:1}
.play .holenav{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:3;background:var(--bg);margin:8px -16px 0;padding:10px 16px;border-top:1px solid var(--line)}
.seg-h{font-size:18px;margin:0 0 8px}
.dots{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:12px 0}
.dots button{min-height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;color:var(--muted)}
.dots button.done{background:var(--surface);color:var(--ink)}
.dots button.cur{border-color:var(--gold);border-width:2.5px;color:var(--ink)}

/* Scorekort */
.sc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px 12px;padding:0 16px}
table.card{border-collapse:collapse;font-size:15px;min-width:100%}
table.card th,table.card td{border:1px solid var(--line);text-align:center;padding:6px 4px;min-width:34px}
table.card th.lbl{text-align:left;min-width:62px;font-weight:600;position:sticky;left:-16px;background:var(--bg);padding-left:6px}
table.card tr.hd th{background:var(--green);color:var(--on-green);border-color:var(--green)}
table.card tr.hd th.lbl{background:var(--green)}
table.card tr.hd th[data-act]{cursor:pointer}
table.card tr.dim td{color:var(--muted);font-size:13px}
table.card td.rec i{font-style:normal;color:var(--gold);letter-spacing:-1px;font-size:16px}
table.card tr.score td{font-family:var(--cond);font-size:20px;font-weight:600}
td.sc span{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center}
td.sc span.birdie{border:2px solid var(--under);border-radius:50%;color:var(--under)}
td.sc span.eagle{border:4px double var(--under);border-radius:50%;color:var(--under)}
td.sc span.bogey{border:2px solid var(--over);color:var(--over)}
td.sc span.dbl{border:4px double var(--over);color:var(--over)}
td.pu{color:var(--muted)}
.totals,.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.totals div,.kpis div{background:var(--bg);padding:10px 8px}
.totals dt,.kpis dt{font-size:13px;color:var(--muted)}
.totals dd,.kpis dd{margin:0;font-family:var(--cond);font-size:30px;font-weight:600;line-height:1.1}
.diff{margin:12px 0 0;font-size:17px}
.chart{width:100%;height:auto}
.chart .line{fill:none;stroke:var(--green-2);stroke-width:2.5}
.chart .pt{fill:var(--gold)}
.chart .ref{stroke:var(--line);stroke-dasharray:4 4}
.chart .reflbl{fill:var(--muted);font-size:11px;text-anchor:end}

/* Väder */
.wx-now{display:flex;align-items:center;gap:20px}
.wx-temp{font-family:var(--cond);font-size:64px;font-weight:700;line-height:1}
.wx-wind{display:flex;align-items:center;gap:10px}
.wx-wind small{display:block;color:var(--muted)}
.arrow{width:40px;height:40px;fill:var(--green-2)}
.mini{font-size:13px;color:var(--muted);margin:12px 0 4px}
.wx-hours{display:grid;grid-template-columns:repeat(5,1fr);list-style:none;padding:0;margin:0;gap:4px;text-align:center}
.wx-hours li{display:flex;flex-direction:column;background:var(--surface);border-radius:10px;padding:8px 2px}
.wx-hours span,.wx-hours small{font-size:13px;color:var(--muted)}
.wx-hours b{font-family:var(--cond);font-size:22px}
.wx-sun{margin:10px 0 0;font-size:15px}

/* Formulär */
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field span{font-size:14px;font-weight:600;color:var(--muted)}
input{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;min-height:50px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tee{border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:16px 0}
.tee legend{font-family:var(--cond);font-size:20px;font-weight:600;padding:0 6px}
table.holes-edit{border-collapse:collapse;width:100%}
table.holes-edit th,table.holes-edit td{padding:3px}
table.holes-edit thead th{font-size:13px;color:var(--muted);text-align:left}
table.holes-edit tbody th{width:36px;font-family:var(--cond);font-size:18px}
table.holes-edit input{min-height:44px;padding:8px;text-align:center}
.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-size:16px}
.check input{width:26px;height:26px;min-height:0;flex:none;accent-color:var(--green-2)}
.errors{border:2px solid var(--danger);color:var(--danger);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.errors ul{margin:6px 0 0;padding-left:20px}
.pass{color:var(--ok);font-weight:600}
.fail{color:var(--danger);font-weight:600}
.testlist{list-style:none;padding:0;font-size:14px;max-height:280px;overflow:auto;margin:0}
.testlist li.bad{color:var(--danger)}
.testlist li.ok{color:var(--muted)}

/* Flikar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--green);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;color:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-height:62px;font-size:12px;font-weight:600}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tabs button.on{color:#FFFFFF}
.tabs button.on svg{stroke:var(--gold)}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:7;max-width:90vw;text-align:center}

/* Etapp 2 – GPS och karta */
.gps{border:2px solid var(--line);border-radius:16px;padding:12px;margin:4px 0 8px}
.gps-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gps-st{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.gps-st.weak{color:var(--danger)}
.gps-st.bad{color:var(--danger);font-weight:500;flex:1 1 100%}
.gps-st.sim{color:var(--muted);font-weight:500}
.gps-st .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.gps-st .dot.wait{background:var(--gold)}
.gps-go{width:100%}
.suggest{width:100%;margin:10px 0 0;min-height:48px;border-radius:12px;border:2px dashed var(--gold);background:transparent;font-weight:600}
.dist3{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:end;text-align:center;margin:10px 0 4px}
.dist3 div{display:flex;flex-direction:column}
.dist3 small{font-size:13px;color:var(--muted);font-weight:600}
.dist3 b{font-family:var(--cond);font-size:44px;line-height:1;font-weight:600}
.dist3 .mid b{font-size:84px;font-weight:700}
.note.center{text-align:center}
.target-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px}
.target-row b{font-family:var(--cond);font-size:22px}
.windrel{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:600}
.windrel small{color:var(--muted);font-weight:500}
.arrow.sm{width:24px;height:24px}
.hazards{list-style:none;padding:0;margin:8px 0}
.hazards li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.hz{width:14px;height:14px;border-radius:4px;flex:none}
.hz.bunker{background:#E6D7A3;border:1px solid #9C8A4E}
.hz.water{background:#3C7DD1}
.hz.dogleg{background:transparent;border:2px solid var(--muted);border-radius:0 8px 0 0;border-left:0;border-bottom:0}
.hz-name{flex:1;font-size:16px}
.hz-n{display:flex;flex-direction:column;align-items:flex-end;min-width:54px}
.hz-n b{font-family:var(--cond);font-size:26px;line-height:1}
.hz-n small{font-size:12px;color:var(--muted)}
.maptools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.holemap{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation;cursor:crosshair}
.m-bg{fill:#1F4A35}
.m-fair{fill:#4F9A55;stroke:#2F6B37;stroke-width:1}
.m-tee{fill:#6FB35F;stroke:#2F6B37}
.m-green{fill:#7ED68E;stroke:#FFFFFF;stroke-width:1.5}
.m-bunker{fill:#EADBA8;stroke:#B49A55}
.m-water{fill:#3C7DD1;stroke:#2A5FA6}
.sat .m-fair{fill:rgba(120,200,120,.12);stroke:rgba(255,255,255,.35)}
.sat .m-tee{fill:rgba(120,200,120,.2);stroke:rgba(255,255,255,.5)}
.sat .m-green{fill:rgba(126,214,142,.25)}

<noscript>Banboken behöver JavaScript.</noscript>
<script>/* Banboken – kärnberäkningar (WHS, slagfördelning, poäng, statistik).
   Rena funktioner utan UI, så de kan testas och flyttas till TypeScript senare. */
(function (root) {
  'use strict';

  // WHS: värden som slutar på exakt ,5 avrundas uppåt (även för plushandicap: -2,5 → -2).
  function whsRound(x) {
    return Math.round(Math.round(x * 1000) / 1000);
  }

  // "+2.3" eller "+2,3" betyder plushandicap och lagras som -2.3.
  function parseHandicapIndex(input) {
    if (input === null || input === undefined) return null;
    var s = String(input).trim().replace(',', '.');
    if (s === '') return null;
    var plus = s.charAt(0) === '+';
    var n = parseFloat(plus ? s.slice(1) : s);
    if (!isFinite(n)) return null;
    var v = plus ? -Math.abs(n) : n;
    if (v < -10 || v > 54) return null;
    return Math.round(v * 10) / 10;
  }

  function formatHandicap(v) {
    if (v === null || v === undefined || !isFinite(v)) return '–';
    if (v < 0) return '+' + String(Math.abs(v)).replace('.', ',');
    return String(v).replace('.', ',');
  }

  function formatSigned(v) {
    if (v === 0) return 'E';
    return (v > 0 ? '+' : '') + v;
  }

  // Course Handicap = HI × (Slope / 113) + (CR − Par), avrundat enligt WHS.
  function courseHandicapExact(hi, slope, cr, par) {
    return hi * (slope / 113) + (cr - par);
  }
  function courseHandicap(hi, slope, cr, par) {
    return whsRound(courseHandicapExact(hi, slope, cr, par));
  }

  // Playing Handicap = Course Handicap × handicapreduktion, avrundat.
  function playingHandicap(ch, allowancePct) {
    var pct = allowancePct === undefined ? 100 : allowancePct;
    return whsRound(ch * pct / 100);
  }

  // Slag per hål utifrån hålindex (1 = svårast). Plushandicap lämnar tillbaka slag
  // från hålindex 18 och nedåt.
  function strokesOnHole(ph, si, holeCount) {
    var n = holeCount || 18;
    if (ph >= 0) {
      return Math.floor(ph / n) + ((si <= ph % n) ? 1 : 0);
    }
    var give = -ph;
    return -(Math.floor(give / n) + ((si > n - (give % n)) ? 1 : 0));
  }

  function strokeAllocation(ph, holes) {
    return holes.map(function (h) { return strokesOnHole(ph, h.si, holes.length); });
  }

  // Poängbogey: 2 poäng för netto par. Strukna hål (null) ger 0 poäng.
  function stablefordPoints(gross, par, received) {
    if (gross === null || gross === undefined) return 0;
    return Math.max(0, 2 + par + received - gross);
  }

  // Netto dubbelbogey = maxresultat per hål för handicapregistrering.
  function netDoubleBogey(par, received) {
    return par + 2 + received;

<script>/* Banboken – etapp 1. Offline-först: all data sparas lokalt efter varje ändring. */
(function () {
  'use strict';
  var C = window.Core;
  var KEY = 'banboken:v1';

  // ---------- Demo-data (tydligt märkt, räknas inte i statistik) ----------
  function demoCourse() {
    var pars = demoCourse.base.pars, sis = demoCourse.base.sis, yellow = demoCourse.base.yellow;
    function tee(id, name, cr, slope, factor) {
      return { id: id, name: name, cr: cr, slope: slope, holes: pars.map(function (p, i) {
        return { par: p, si: sis[i], length: Math.round(yellow[i] * factor) };
      }) };
    }
    return {
      id: 'demo', name: 'Demobanan', club: 'Exempelklubben', demo: true, verified: false, lat: null, lon: null,
      tees: [tee('demo-y', 'Gul 57', 70.4, 127, 1), tee('demo-r', 'Röd 48', 68.1, 121, 0.84)],
      geo: demoGeo()
    };
  }
  demoCourse.base = {
    pars: [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 4, 3, 5, 4, 4, 3, 4, 5],
    sis: [7, 3, 15, 11, 1, 9, 17, 5, 13, 8, 4, 16, 12, 2, 10, 18, 6, 14],
    yellow: [345, 372, 148, 468, 395, 330, 132, 360, 455, 340, 380, 155, 470, 402, 325, 140, 365, 480]
  };

  function defaultState() {
    return {
      version: 1,
      profile: { name: '', hi: null, homeClub: '', lang: 'sv', theme: 'auto', allowance: 100 },
      courses: [demoCourse()],
      rounds: [],
      weatherCache: {},
      friends: [],
      bag: [],
      baseline: null,
      ui: { showDemo: false, statsN: 10, sat: true, gpsAuto: false, mapOpen: true, shotLog: false, trendMetric: 'points', sgBase: 'personal' }
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.version === 1) {
          var d = defaultState();
          s.profile = Object.assign(d.profile, s.profile || {});
          s.ui = Object.assign(d.ui, s.ui || {});
          s.weatherCache = s.weatherCache || {};
          s.friends = s.friends || [];
          s.bag = s.bag || [];
          if (s.baseline === undefined) s.baseline = null;
          s.courses = s.courses || [];
          s.rounds = s.rounds || [];
          s.courses.forEach(function (c) { if (c.id === 'demo' && !c.geo) c.geo = demoGeo(); });
          return s;
        }
      }
    } catch (e) { /* tom eller trasig lagring – börja om */ }
    return defaultState();
  }

  // ======================= ETAPP 2: GPS, KARTA, OPENSTREETMAP =======================
  var G = window.Geo;
  var gps = { status: 'off', pos: null, watchId: null, target: null, sim: false, suggest: null, lastRender: 0, lastAuto: null };
  var mapCtx = null, satFailed = false;

  function demoGeo() {
    var c = demoCourse.base;
    return G.demoGeometry([56.95, 15.05], c.pars.map(function (p, i) { return { par: p, si: c.sis[i], length: c.yellow[i] }; }));
  }
  function teePoint(h) { return h.tees && h.tees[0] ? G.centroid(h.tees[0]) : h.line[0]; }
  function greenCenter(h) { return h.green ? G.centroid(h.green) : h.line[h.line.length - 1]; }
  function posLL() { return gps.pos ? [gps.pos.lat, gps.pos.lon] : null; }

  function gpsStart() {
    if (gps.watchId !== null || gps.sim) return;
    if (!navigator.geolocation) { gps.status = 'unavailable'; refreshGps(); return; }
    gps.status = 'asking';
    try {
      gps.watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    } catch (e) { gps.status = 'unavailable'; gps.watchId = null; }
  }
  function gpsStop() {
    if (gps.watchId !== null) { try { navigator.geolocation.clearWatch(gps.watchId); } catch (e) {} gps.watchId = null; }
    if (gps.status === 'on' || gps.status === 'asking') gps.status = 'off';
  }
  function onPos(p) {
    if (gps.sim) return;
    var np = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, ts: Date.now() };
    var moved = !gps.pos || G.dist([gps.pos.lat, gps.pos.lon], [np.lat, np.lon]) > 1.5 || Math.abs(np.acc - gps.pos.acc) > 3;
    gps.status = 'on'; gps.pos = np;
    if (!state.ui.gpsAuto) { state.ui.gpsAuto = true; save(); }
    if (moved || Date.now() - gps.lastRender > 5000) afterPosition();
  }
  function onPosErr(e) {
    if (e.code === 1) { gpsStop(); gps.status = 'denied'; state.ui.gpsAuto = false; save(); }
    else if (!gps.pos) gps.status = 'unavailable';
    refreshGps();
  }

  // Automatisk hålidentifiering: byter hål när spelaren står på nästa tee och föregående hål har ett resultat.
  function afterPosition() {
    var r = activeRound(); if (!r || !gps.pos) return;
    var c = courseById(r.courseId), g = c && c.geo; gps.suggest = null;
    if (g) {
      var me = posLL(), next = g.holes[String(r.current + 2)], cur = r.holes[r.current];
      var done = typeof cur.strokes === 'number' || cur.pickedUp;
      if (next && done && G.dist(me, teePoint(next)) < 25 && gps.lastAuto !== r.current + 1) {
        gps.lastAuto = r.current + 1; r.current++; gps.target = null; save();
        view.flash = t('autoHole') + ' ' + (r.current + 1); render(); return;
      }
      var nh = G.nearestHole(me, g.holes);
      if (nh && nh.d < 30) { var idx = +nh.ref - 1; if (idx !== r.current && idx >= 0 && idx < r.holes.length) gps.suggest = idx; }
    }
    refreshGps();
  }
  function refreshGps() {
    var el = document.getElementById('gps-box'), r = activeRound();
    if (el && r && view.tab === 'round' && view.holeMode === 'hole') { el.innerHTML = gpsInner(r); gps.lastRender = Date.now(); }
  }

  function gpsStatusHtml(g) {
    if (gps.sim) return '<span class="gps-st sim">' + esc(t('simHint')) + '</span>';
    if (gps.status === 'on' && gps.pos) {
      var weak = gps.pos.acc > 20;
      return '<span class="gps-st' + (weak ? ' weak' : '') + '"><i class="dot"></i>GPS ±' + Math.round(gps.pos.acc) + ' m' + (weak ? ' · ' + esc(t('gpsWeak')) : '') + '</span>';
    }
    if (gps.status === 'asking') return '<span class="gps-st"><i class="dot wait"></i>' + esc(t('gpsSearching')) + '</span>';
    if (gps.status === 'denied') return '<span class="gps-st bad">' + esc(t('gpsDenied')) + '</span>';
    if (gps.status === 'unavailable') return '<span class="gps-st bad">' + esc(t('gpsUnavailable')) + '</span> <button class="chip" data-act="gps-start">' + esc(t('retry')) + '</button>';
    return '<button class="btn gold gps-go" data-act="gps-start">' + esc(t('gpsStart')) + '</button><p class="note">' + esc(t('gpsWhy')) + '</p>';
  }

  function d3(key, v, approx, big) {
    return '<div class="' + (big ? 'mid' : '') + '"><small>' + esc(t(key)) + (approx ? ' ≈' : '') + '</small><b>' + (v === null || v === undefined ? '–' : Math.round(v)) + '</b></div>';
  }

  function gpsInner(r) {
    var c = courseById(r.courseId), g = c && c.geo, h = '';
    if (!g) return '<p class="note">' + esc(t('noGeo')) + '</p>';
    var hole = g.holes[String(r.current + 1)];
    h += '<div class="gps-top">' + gpsStatusHtml(g) + (g.source === 'demo' ? '<em class="tag demo">' + esc(t('demoGeo')) + '</em>' : '<em class="tag">' + esc(t('osmUnverified')) + '</em>') + '</div>';
    if (gps.suggest !== null && gps.suggest !== r.current) h += '<button class="suggest" data-act="go:' + gps.suggest + '">' + esc(t('seemsOnHole')) + ' ' + (gps.suggest + 1) + ' – ' + esc(t('switch')) + '</button>';

  function resolveGame(type, cfg, teams) {
    var g = { id: uid(), type: type };
    if (type === 'match' || type === 'nassau') {
      g.sides = [cfg.sideA, cfg.sideB];
      var four = sideSize(cfg.sideA, teams) > 1 || sideSize(cfg.sideB, teams) > 1;

    } else if (type === 'bestball' || type === 'worstball') {

      if (!g.teams.length) g.teams = teams.map(function (x) { return x.id; });
      g.scoring = cfg.scoring || (type === 'worstball' ? 'stableford' : 'stroke');
      g.allowance = cfg.allowance === 'auto' || cfg.allowance === undefined ? GM.DEFAULTS[type] : +cfg.allowance;

  // --- Inmatning för medspelare och lag ---

  // --- Resultattexter ---
  function matchText(res) {
    if (res.error) return t('verr_' + res.error);
    var A = res.sides[0], B = res.sides[1];
    if (res.closed) {
      if (res.winner === 'halved') return t('halvedMatch');
      var w = res.winner === 'A' ? A : B;
      return w + ' ' + t('won') + ' ' + (res.result === Math.abs(res.up) + 'up' ? Math.abs(res.up) + ' ' + t('up') : res.result);
    }
    if (!res.thru) return t('notStarted');
    if (res.up === 0) return t('allSquare') + ' · ' + res.thru + ' ' + t('holesPlayed');
    return (res.up > 0 ? A : B) + ' ' + Math.abs(res.up) + ' ' + t('up') + (res.dormie ? ' (dormie)' : '') + ' · ' + res.remaining + ' ' + t('toPlay');
  }
  function part(res, k) { return Object.assign({ sides: res.sides }, res[k]); }
  function shortStatus(g, res) {
    if (res.error) return t('verr_' + res.error);
    if (g.type === 'match' || g.type === 'teamMatch') return matchText(res);
    if (g.type === 'nassau') return t('front9') + ': ' + matchText(part(res, 'front')) + ' · ' + t('back9') + ': ' + matchText(part(res, 'back'));
    if (g.type === 'skins') {
      var top = res.rows[0];
      return top && top.skins ? top.name + ' ' + top.skins + ' skins' + (res.carry ? ' · ' + res.carry + ' ' + t('inPot') : '') : res.carry ? res.carry + ' ' + t('inPot') : t('noSkinsYet');
    }
    var r0 = res.rows && res.rows[0];
    if (!r0 || !r0.thru) return t('notStarted');
    if (g.type === 'stableford' || ((g.type === 'bestball' || g.type === 'worstball') && res.scoring === 'stableford')) return r0.name + ' ' + r0.points + ' p';
    return r0.name + ' ' + signed(r0.netToPar) + ' ' + t('netShort');
  }
  function winnerText(g, res) {
    if (res.error) return null;
    if (g.type === 'match' || g.type === 'teamMatch') return res.closed ? matchText(res) : null;
    if (g.type === 'nassau') return res.total.closed && res.back.closed && res.front.closed ? [t('front9') + ': ' + matchText(part(res, 'front')), t('back9') + ': ' + matchText(part(res, 'back')), t('total') + ': ' + matchText(part(res, 'total'))].join(' · ') : null;
    if (!res.complete || !res.rows.length) return null;
    var a = res.rows[0], b = res.rows[1];
    var key = g.type === 'skins' ? 'skins' : (g.type === 'stableford' || res.scoring === 'stableford') ? 'points' : 'netToPar';
    if (key !== 'skins' && a.nr) return null;
    if (b && a[key] === b[key]) return t('tie') + ': ' + res.rows.filter(function (x) { return x[key] === a[key]; }).map(function (x) { return x.name; }).join(', ');
    return t('winner') + ': ' + a.name;
  }

  function gamesPanel(r) {

  function board(r, live) {

        }), true);

    });
    h += '<div class="holenav"><button class="btn ghost" data-act="share:' + r.id + '">' + esc(t('shareStanding')) + '</button></div><p class="note">' + esc(t('shareHelp')) + '</p>';

  function table(head, rows, rawCells) {

  function groupCard(r) {

  // --- Scorekort ---
  function scorecard(r, s, live) {
    var holes = r.tee.holes;
    function cellScore(k) {
      var d = r.holes[k];
      if (d.pickedUp) return '<td class="sc pu">–</td>';
      if (typeof d.strokes !== 'number') return '<td class="sc"></td>';
      var diff = d.strokes - holes[k].par;
      var cls = diff <= -2 ? 'eagle' : diff === -1 ? 'birdie' : diff === 1 ? 'bogey' : diff >= 2 ? 'dbl' : '';
      return '<td class="sc"><span class="' + cls + '">' + d.strokes + '</span></td>';
    }
    function half(from, to, label) {
      var rows = { no: '', par: '', si: '', rec: '', sc: '', pts: '', putt: '' }, parSum = 0, scSum = 0, ptSum = 0, puSum = 0;
      for (var k = from; k < to; k++) {
        var d = r.holes[k], rec = s.allocation[k];
        rows.no += '<th' + (live ? ' data-act="go-hole:' + k + '"' : '') + '>' + (k + 1) + '</th>';
        rows.par += '<td>' + holes[k].par + '</td>'; parSum += holes[k].par;
        rows.si += '<td>' + holes[k].si + '</td>';
        rows.rec += '<td class="rec">' + (rec > 0 ? '<i>' + new Array(rec + 1).join('•') + '</i>' : rec < 0 ? '<i>−</i>' : '') + '</td>';
        rows.sc += cellScore(k); if (typeof d.strokes === 'number' && !d.pickedUp) scSum += d.strokes;
        var p = (typeof d.strokes === 'number' || d.pickedUp) ? C.stablefordPoints(d.pickedUp ? null : d.strokes, holes[k].par, rec) : '';
        rows.pts += '<td>' + p + '</td>'; if (p !== '') ptSum += p;
        rows.putt += '<td>' + (typeof d.putts === 'number' ? d.putts : '') + '</td>'; if (typeof d.putts === 'number') puSum += d.putts;
      }
      return '<div class="sc-wrap"><table class="card"><tbody>' +
        '<tr class="hd"><th class="lbl">' + esc(t('hole')) + '</th>' + rows.no + '<th>' + esc(label) + '</th></tr>' +
        '<tr><th class="lbl">' + esc(t('par')) + '</th>' + rows.par + '<td><b>' + parSum + '</b></td></tr>' +
        '<tr class="dim"><th class="lbl">' + esc(t('si')) + '</th>' + rows.si + '<td></td></tr>' +
        '<tr class="dim"><th class="lbl">' + esc(t('received')) + '</th>' + rows.rec + '<td></td></tr>' +
        '<tr class="score"><th class="lbl">' + esc(t('strokes')) + '</th>' + rows.sc + '<td><b>' + scSum + '</b></td></tr>' +
        '<tr><th class="lbl">' + esc(t('putts')) + '</th>' + rows.putt + '<td>' + puSum + '</td></tr>' +
        '<tr><th class="lbl">' + esc(t('points')) + '</th>' + rows.pts + '<td><b>' + ptSum + '</b></td></tr>' +
        '</tbody></table></div>';
    }
    var h = half(0, 9, t('out')) + half(9, 18, t('in'));
    h += '<p class="note">' + esc(t('receivedLegend')) + '</p>';
    h += '<dl class="totals"><div><dt>' + esc(t('gross')) + '</dt><dd>' + s.gross + '</dd></div><div><dt>' + esc(t('net')) + '</dt><dd>' + s.net + '</dd></div>' +
      '<div><dt>' + esc(t('points')) + '</dt><dd>' + s.points + '</dd></div><div><dt>' + esc(t('putts')) + '</dt><dd>' + s.putts + '</dd></div>' +
      '<div><dt>' + esc(t('firPct')) + '</dt><dd>' + s.firHit + '/' + s.firTot + '</dd></div><div><dt>' + esc(t('girPct')) + '</dt><dd>' + s.girHit + '/' + s.girTot + '</dd></div></dl>';
    if (s.differential !== null) h += '<p class="diff">' + esc(t('differential')) + ': <b>' + dec(s.differential) + '</b></p><p class="note">' + esc(t('differentialHelp')) + '</p>';
    if (live) h += '<button class="btn gold big" data-act="finish">' + esc(t('finishRound')) + '</button>';
    return h;
  }

  function kpi(l, v) { return '<div><dt>' + esc(l) + '</dt><dd>' + esc(v) + '</dd></div>'; }
  function trendChart(list) {
    if (list.length < 2) return '<p class="muted">' + esc(t('noData')) + '</p>';
    var W = 320, H = 140, pad = 22, max = Math.max.apply(null, list.map(function (s) { return s.points; }).concat([36])) + 2, min = Math.max(0, Math.min.apply(null, list.map(function (s) { return s.points; })) - 4);
    var step = (W - pad * 2) / (list.length - 1);
    function y(v) { return H - pad - (v - min) / (max - min) * (H - pad * 2); }
    var pts = list.map(function (s, i) { return (pad + i * step).toFixed(1) + ',' + y(s.points).toFixed(1); });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('trend')) + '">' +
      '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(36) + '" y2="' + y(36) + '" class="ref"/><text x="' + (W - pad) + '" y="' + (y(36) - 4) + '" class="reflbl">36</text>' +
      '<polyline points="' + pts.join(' ') + '" class="line"/>' +
      list.map(function (s, i) { return '<circle cx="' + (pad + i * step) + '" cy="' + y(s.points) + '" r="3.5" class="pt"/>'; }).join('') + '</svg>';
  }

    else if (view.tab === 'play' && view.play) body = viewPlay();

    else if (view.tab === 'round') body = view.sub === 'setup' ? viewSetup() : viewRound();
    else if (view.tab === 'courses') body = view.sub === 'edit' ? viewCourseEdit() : viewCourses();
    else if (view.tab === 'stats') body = viewStats();
    else body = view.sub === 'setup' ? viewSetup() : viewProfile();
    var warn = storageOk ? '' : '<p class="warn tight">Lagringen är full eller blockerad – exportera dina data.</p>';
    appEl.className = view.tab === 'play' ? 'playmode' : '';
    appEl.innerHTML = body + warn + flash() + (view.tab === 'play' ? '' : nav2());
    manageTimers();
    var inPlay = view.tab === 'round' && !view.sub && activeRound() && view.holeMode === 'hole';
    if (inPlay) { gps.lastRender = Date.now(); if (state.ui.gpsAuto && gps.watchId === null && gps.status !== 'denied' && !gps.sim && !document.hidden) gpsStart(); }
    else gpsStop();
    if (view.flash) { var f = view.flash; setTimeout(function () { if (view.flash === f) { view.flash = null; var el = appEl.querySelector('.flash'); if (el) el.remove(); } }, 1800); }
  }

  function updateHole(fn) {
    var r = activeRound(); if (!r) return;

        try {
          var file = new File([blob], fname, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: fname }).catch(function () {}); return; }
        } catch (e) { /* faller tillbaka till nedladdning */ }
        var aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = fname; document.body.appendChild(aEl); aEl.click(); aEl.remove();
        return;
      }
      case 'clear': if (confirm(t('clearConfirm'))) { cloud.session = null; cloud.synced = {}; cloud.lastPull = null; saveCloud(); var lang = state.profile.lang; state = defaultState(); state.profile.lang = lang; save(); view = { tab: 'home', setup: {}, errors: [], holeMode: 'hole' }; } else return; break;
      default: return;
    }
    render();
  }

  function onField(el) {
    var key = el.getAttribute('data-field'), val = el.type === 'checkbox' ? el.checked : el.value;
    if (key === 'import') {
      var f = el.files && el.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var s = JSON.parse(rd.result);
          if (!s || s.version !== 1 || !Array.isArray(s.rounds) || !Array.isArray(s.courses)) throw new Error('format');
          state = s; save(); state = load(); view.flash = t('importDone');
        } catch (e) { view.flash = t('importFailed'); }
        render();
      };
      rd.readAsText(f); return;
    }
    if (key === 'ui.showDemo') { state.ui.showDemo = val; save(); render(); return; }
    if (key === 'ui.sat' || key === 'ui.gpsAuto') { state.ui[key.slice(3)] = val; save(); render(); return; }
    if (key === 'find.q') { view.find.q = val; return; }
    if (key.indexOf('add.') === 0) { view.setup.add[key.slice(4)] = val; return; }
    if (key.indexOf('cloud.') === 0) { cloudForm[key.slice(6)] = val; return; }
    if (key === 'live.code') { view.liveCode = val; return; }
    if (key === 'play.q') { if (view.play.q === val) return; view.play.q = val; var pr = document.getElementById('play-results'); if (pr) pr.innerHTML = playResults(); return; }
    if (key === 'dir.q') { if (view.dirQ === val) return; view.dirQ = val; var dl = document.getElementById('dir-list'); if (dl) dl.innerHTML = dirListHtml(); return; }
    if (key === 'sd.dist') { var ar = activeRound(); if (ar) shotDraft(ar).dist = val; return; }
    if (key.indexOf('bag.') === 0) {
      var bp = key.split('.'), bc = state.bag.filter(function (c) { return c.id === bp[1]; })[0];
      if (bc) { if (bp[2] === 'carry') { var cv = parseInt(val, 10); bc.carry = isFinite(cv) && cv > 0 && cv < 400 ? cv : null; } else bc.name = String(val).slice(0, 20) || bc.name; save(); }
      return;
    }
    if (key === 'baseline-import') {
      var bf = el.files && el.files[0]; if (!bf) return;
      var br = new FileReader();
      br.onload = function () {
        try {
          var b = JSON.parse(br.result);
          if (!ST.validateBaseline(b)) throw new Error('format');
          b.name = String(b.name || t('importedName')).slice(0, 40);
          state.baseline = { name: b.name, source: String(b.source || '').slice(0, 200), lies: b.lies };
          state.ui.sgBase = 'imported'; save(); view.flash = t('baselineDone');
        } catch (e) { view.flash = t('baselineFailed'); }
        render();
      };
      br.readAsText(bf); return;
    }
    if (key.indexOf('gside:') === 0) { var gp = key.split(':'); view.setup.games[gp[1]][gp[2]] = val; render(); return; }
    if (key === 'gcarry:skins') { view.setup.games.skins.carryover = val; render(); return; }
    if (key.indexOf('p.') === 0) {
      var pk = key.slice(2);
      if (pk === 'hi') {
        var hi = C.parseHandicapIndex(val);
        view.hiError = val.trim() !== '' && hi === null;
        if (!view.hiError) state.profile.hi = hi;
      } else state.profile[pk] = val;
      save(); render(); return;
    }
    var d = view.draft; if (!d) return;
    if (key.indexOf('c.') === 0) {
      var ck = key.slice(2);
      if (ck === 'lat' || ck === 'lon') d[ck] = String(val).trim() === '' ? null : num(val);
      else d[ck] = val;
      return; // ingen omritning medan man skriver
    }
    var m = key.match(/^t(\d+)\.(?:h(\d+)\.)?(\w+)$/);
    if (m) {
      var te = d.tees[+m[1]];
      if (m[2] !== undefined) {
        var hv = String(val).trim() === '' ? null : parseInt(val, 10);
        te.holes[+m[2]][m[3]] = isFinite(hv) ? hv : null;
      } else if (m[3] === 'name') te.name = val;
      else if (m[3] === 'unrated') te.unrated = !!val;
      else te[m[3]] = String(val).trim() === '' ? null : num(val);
    }
  }

  function init() {
    appEl = document.getElementById('app');
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      if (el.tagName === 'SUMMARY') e.preventDefault();
      onAct(el.getAttribute('data-act'));
    });
    document.addEventListener('change', function (e) { if (e.target.hasAttribute('data-field')) onField(e.target); });
    document.addEventListener('input', function (e) {
      var k = e.target.getAttribute('data-field');
      if (k && (k.indexOf('c.') === 0 || /^t\d/.test(k) || k === 'find.q' || k.indexOf('add.') === 0 || k === 'sd.dist' || k.indexOf('cloud.') === 0 || k === 'live.code' || k === 'dir.q' || k === 'play.q')) onField(e.target);
    });
    window.addEventListener('pagehide', save);
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-field') === 'find.q') { view.find.q = e.target.value; searchCourses(view.find.q); } });
    document.addEventListener('click', function (e) {
      var svg = e.target.closest && e.target.closest('svg.holemap');
      if (!svg || !mapCtx || !svg.getScreenCTM) return;
      var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      var loc = pt.matrixTransform(svg.getScreenCTM().inverse()), ll = mapCtx.fromSvg([loc.x, loc.y]);
      if (gps.sim) { gps.pos = { lat: ll[0], lon: ll[1], acc: 3, ts: Date.now() }; gps.status = 'on'; afterPosition(); }
      else { gps.target = ll; refreshGps(); }
    });
    document.addEventListener('error', function (e) {
      var el = e.target;
      if (el && el.tagName === 'image' && el.closest && el.closest('svg.holemap') && !satFailed) { satFailed = true; refreshGps(); }
    }, true);
    window.addEventListener('online', function () { satFailed = false; });
    document.addEventListener('visibilitychange', function () { if (document.hidden) gpsStop(); else render(); });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', render);
    }
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    var sx = null;
    document.addEventListener('touchstart', function (e) { var el = e.target.closest && e.target.closest('[data-swipe]'); sx = el ? { x: e.touches[0].clientX, y: e.touches[0].clientY, k: el.getAttribute('data-swipe') } : null; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (!sx) return; var dx = e.changedTouches[0].clientX - sx.x, dy = e.changedTouches[0].clientY - sx.y, k = sx.k; sx = null;
      if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
      onAct((k === 'type' ? 'ptype:' : 'pcourse:') + (dx < 0 ? 1 : -1));
    }, { passive: true });
    setInterval(function () { syncNow(false); }, 60000);
    window.addEventListener('online', function () { syncNow(false); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) syncNow(false); });
    setTimeout(function () { syncNow(false); }, 1500);
    checkHash();
    window.addEventListener('hashchange', function () { checkHash(); render(); });
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
